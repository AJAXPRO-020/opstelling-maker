[build]
  publish = "dist"
  command = "sh scripts/build-public.sh"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-mI4HawSTS6RRtD4LluZJI2KSOy6G6Ab1WXCZuH+0Lt8='; style-src 'self' 'unsafe-inline'; img-src 'self' https://ajaxpro.fans data: blob:; connect-src 'self' https://ajaxpro.fans; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Favicon/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
