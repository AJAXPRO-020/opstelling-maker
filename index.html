<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajax Opstelling Maker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="sidebar" aria-label="Ajax selectie">
        <div class="brand-strip">
          <div>
            <p class="eyebrow">Ajax 1</p>
            <h1>Opstelling Maker</h1>
          </div>
          <button class="ghost-button" id="resetButton" type="button">Reset</button>
        </div>

        <div class="toolbar">
          <label class="search-box">
            <span>Zoek speler</span>
            <input id="playerSearch" type="search" placeholder="Naam, positie of rugnummer" />
          </label>
          <div class="selection-count">
            <strong id="selectedCount">0</strong>
            <span>/ 11 gekozen</span>
          </div>
        </div>

        <div class="player-list" id="playerList" aria-live="polite"></div>
      </section>

      <section class="field-panel" aria-label="Visueel voetbalveld">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Formatie</p>
            <h2 id="formationTitle">4-3-3</h2>
          </div>
          <div class="status-pill" id="statusPill">Kies posities 1-11</div>
        </div>

        <div class="pitch-wrap">
          <div class="pitch" id="pitch" role="img" aria-label="Voetbalveld met gekozen Ajax-spelers">
            <div class="pitch-line halfway"></div>
            <div class="pitch-line center-circle"></div>
            <div class="pitch-line box top-box"></div>
            <div class="pitch-line box bottom-box"></div>
            <div class="pitch-line small-box top-small-box"></div>
            <div class="pitch-line small-box bottom-small-box"></div>
          </div>
        </div>

        <div class="formation-control">
          <label for="formationSelect">Opstelling wijzigen</label>
          <select id="formationSelect"></select>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
